name: 🚀 CI/CD Pipeline
on:
  push:
    branches:
      - main
      - staging
jobs:
  build:
    name: 🐳 Build & Test Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🐳 Build Docker image
        run: docker build -t dstlib-app .
  deploy-staging:
    name: 🧪 Deploy to Staging
    needs: build
    runs-on: self-hosted
    if: github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4
      - name: 🧪 Deploy staging
        run: |
          cd $GITHUB_WORKSPACE
          sudo docker-compose -f docker-compose.staging.yml down
          sudo docker-compose -f docker-compose.staging.yml up -d --build
          echo "✅ Staging live at localhost:3040"
  deploy-production:
    name: 🚀 Deploy to Production
    needs: build
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: 🚀 Deploy production
        run: |
          cd $GITHUB_WORKSPACE
          sudo docker-compose down --remove-orphans
          sudo docker stop $(sudo docker ps -q) 2>/dev/null || true
          sudo docker rm $(sudo docker ps -aq) 2>/dev/null || true
          sudo docker-compose up -d --build
          echo "✅ Production live at localhost:3039"
      - name: 🔍 Health Check
        run: |
          sleep 10
          curl -f http://localhost:3039 && echo "✅ Site is healthy!" || echo "❌ Site is down!"
      - name: 📊 Show container logs
        run: |
          sudo docker-compose logs --tail=50
